[project]
name = "sdn_threat_detection"
version = "0.1.0"
description = "Automated SDN threat mitigation using Suricata and OpenFlow rule injection."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ryu",
    # ryu's dependencies
    "eventlet>=0.40.4",
    "netaddr>=1.3.0",
    "oslo-config>=10.3.0",
    "routes>=2.5.1",
    "six>=1.17.0",
    "tinyrpc>=1.1.7",
    "webob>=1.8.9",
    # attack simulation
    "scapy>=2.6",
    "mininet>=2.3.0.dev6",
]

[tool.uv.sources]
ryu = { git = "https://github.com/MalachiteN/ryu-python-3.12.git" }

[tool.ty.environment]
extra-paths = ["/home/ozan/.local/lib/python3.12/site-packages"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "ruff>=0.15.4",
    "ty>=0.0.19",
]

[tool.ruff]
line-length = 79
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "PIE",
    "SIM",
    "RET",
    "ARG",
    "EM",
    "PTH",
    "PL",
    "RUF",
    "S",
    "BLE",
    "ANN",
    "ASYNC",
    "PT",
    "D101",
    "D102",
    "D103",
]
ignore = [
    "E501",
    "ISC001",
    "COM812",
    "D203",
    "D213",
    "ANN401",  # use Any in **kwargs
    "PLR0913",
    "PLR2004",
    "S101",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D101", "D102", "D103"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["--strict-markers", "--strict-config", "-ra"]
xfail_strict = true
markers = [
    "unit: fast isolated tests",
    "integration: tests that combine multiple components",
    "slow: tests that take noticeably longer to run",
]